name: ToolGrade
description: Eval-first quality gate for MCP servers - fails the build when your tools stop beating a no-tool baseline.
inputs:
  suite:
    description: Path to the suite YAML file
    required: true
  trials:
    description: Trials per task per arm (overrides the suite)
    required: false
    default: ""
  concurrency:
    description: Parallel trials (overrides the suite)
    required: false
    default: ""
  filter:
    description: Only run tasks with this id or tag
    required: false
    default: ""
  no-baseline:
    description: Skip the no-tool baseline arm
    required: false
    default: "false"
  compare:
    description: Previous run report JSON to compare against; a significant regression fails the job
    required: false
    default: ""
  baseline:
    description: ToolGrade platform origin to compare against the most recent matching run instead of --compare, e.g. https://app.toolgrade.dev (key from toolgrade-api-key or TOOLGRADE_API_KEY)
    required: false
    default: ""
  baseline-branch:
    description: Only match a baseline from this branch (defaults to the PR's base branch, otherwise any branch)
    required: false
    default: ""
  model:
    description: Agent model (overrides the suite)
    required: false
    default: ""
  judge-model:
    description: Judge model (overrides the suite; defaults to --model when that is given)
    required: false
    default: ""
  provider:
    description: Model provider - anthropic, or openai for any OpenAI-compatible endpoint (Ollama, OpenAI, Gemini, Groq...)
    required: false
    default: ""
  base-url:
    description: Endpoint for provider openai
    required: false
    default: ""
  api-key-env:
    description: Env var holding the model API key for provider openai (set it on this step; Ollama needs none)
    required: false
    default: ""
  local-model:
    description: The model runs on your own hardware - price it at $0
    required: false
    default: "false"
  upload-url:
    description: ToolGrade platform origin to upload the report to, e.g. https://app.toolgrade.dev (key from toolgrade-api-key or TOOLGRADE_API_KEY)
    required: false
    default: ""
  toolgrade-api-key:
    description: ToolGrade project API key, for upload-url. Prefer passing this as a secret; TOOLGRADE_API_KEY set on this step also works.
    required: false
    default: ""
  version:
    description: toolgrade npm version
    required: false
    default: latest
outputs:
  report:
    description: Path to the JSON run report
    value: .toolgrade/runs/latest.json
  markdown:
    description: Path to the Markdown summary, suitable for a PR comment
    value: .toolgrade/summary.md
runs:
  using: composite
  steps:
    - name: Run toolgrade
      shell: bash
      env:
        TG_SUITE: ${{ inputs.suite }}
        TG_TRIALS: ${{ inputs.trials }}
        TG_CONCURRENCY: ${{ inputs.concurrency }}
        TG_FILTER: ${{ inputs.filter }}
        TG_NO_BASELINE: ${{ inputs.no-baseline }}
        TG_COMPARE: ${{ inputs.compare }}
        TG_BASELINE: ${{ inputs.baseline }}
        TG_BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        TG_MODEL: ${{ inputs.model }}
        TG_JUDGE_MODEL: ${{ inputs.judge-model }}
        TG_PROVIDER: ${{ inputs.provider }}
        TG_BASE_URL: ${{ inputs.base-url }}
        TG_API_KEY_ENV: ${{ inputs.api-key-env }}
        TG_LOCAL_MODEL: ${{ inputs.local-model }}
        TG_UPLOAD_URL: ${{ inputs.upload-url }}
        TG_VERSION: ${{ inputs.version }}
        TG_API_KEY_INPUT: ${{ inputs.toolgrade-api-key }}
      run: bash "$GITHUB_ACTION_PATH/action/entrypoint.sh"
