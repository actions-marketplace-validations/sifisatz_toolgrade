# Copy to .github/workflows/toolgrade.yml in the repository that ships your MCP server.
name: MCP tool quality
on:
  pull_request:
    paths: ["src/**", "evals/**"]

jobs:
  toolgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Without a hosted ToolGrade project, compare against the default branch's last uploaded
      # report instead - download it as a build artifact (skip this step and `compare:` below if
      # you're using `baseline:`/`upload-url:` instead).
      - uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          branch: main
          name: toolgrade-report
          path: previous

      - uses: toolgrade/toolgrade@v0
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          suite: evals/suite.yaml
          compare: ${{ hashFiles('previous/latest.json') != '' && 'previous/latest.json' || '' }}
          # Hosted alternative to the artifact dance above: compares against the most recent
          # uploaded run for this suite (matched to this PR's base branch automatically), and
          # gives you run history and dashboards. Drop `compare:` above if you use this.
          # baseline: https://app.toolgrade.dev
          # upload-url: https://app.toolgrade.dev
          # toolgrade-api-key: ${{ secrets.TOOLGRADE_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolgrade-report
          path: .toolgrade/runs/latest.json
